name: Compilar EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Compilar con PyInstaller
      run: pyinstaller --onefile --icon=logo.ico servidor_pc_python.py

    - name: Subir ejecutable como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: QuestPlay-Servidor
        path: dist/pc_server_codigo.exe
